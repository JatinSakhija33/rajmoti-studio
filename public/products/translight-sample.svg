<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14110E"/><stop offset="50%" stop-color="#2B2117"/><stop offset="100%" stop-color="#0E0C0A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E2C17C"/>
      <stop offset="50%" stop-color="#FDF3CD"/>
      <stop offset="100%" stop-color="#B88A3B"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="1500" fill="url(#bg)"/>

  <!-- Atmosphere &amp; Studio Lighting -->
  <circle cx="600" cy="525" r="540" fill="#FFF8EE" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="1020" cy="225" r="360" fill="#FFE6B8" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Decorative Inner Border -->
  <rect x="36" y="36" width="1128" height="1428" rx="12" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>
  <rect x="48" y="48" width="1104" height="1404" rx="8" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.2"/>

  <!-- Main Illustration / Graphic Elements -->
  
    <g filter="url(#shadow)" transform="translate(350, 290)">
      <!-- Glowing sunburst backlit circle -->
      <circle cx="250" cy="270" r="230" fill="#FFC966" opacity="0.35" filter="url(#softGlow)"/>
      <circle cx="250" cy="270" r="170" fill="#FFE2A3" opacity="0.5" filter="url(#softGlow)"/>
      <circle cx="250" cy="270" r="100" fill="#FFF7DE" opacity="0.7" filter="url(#softGlow)"/>
      <!-- Silhouettes illuminated by backlighting -->
      <circle cx="215" cy="250" r="45" fill="#2E1C12"/>
      <circle cx="285" cy="265" r="40" fill="#2E1C12"/>
      <path d="M 175 295 C 175 295, 215 285, 255 295 L 260 520 L 170 520 Z" fill="#1C110B"/>
      <path d="M 255 305 C 255 305, 295 295, 335 305 L 340 520 L 250 520 Z" fill="#180F0A"/>
      <!-- Golden Light Rim on Edges -->
      <path d="M 215 205 C 235 205, 255 220, 258 245" stroke="#FFE2A3" stroke-width="4" fill="none"/>
      <path d="M 290 225 C 310 225, 325 240, 328 265" stroke="#FFE2A3" stroke-width="4" fill="none"/>
    </g>
  

  <!-- Studio Typography &amp; Branding -->
  <g transform="translate(0, 1280)" text-anchor="middle">
    <text x="600" y="0" fill="#E2C17C" font-family="'Montserrat', sans-serif" font-size="20" font-weight="600" letter-spacing="6" text-transform="uppercase">Archival Edge-Lit LED Translight</text>
    <text x="600" y="52" fill="#FFFFFF" font-family="'Playfair Display', serif" font-size="44" font-weight="bold">Vows in the Golden Hour</text>
    <text x="600" y="95" fill="#E6DAC8" font-family="'Montserrat', sans-serif" font-size="22" letter-spacing="2" opacity="0.95">High-Diffusion Translucent Art Film</text>
    <text x="600" y="145" fill="#C5B6A0" font-family="'Montserrat', sans-serif" font-size="16" letter-spacing="5">RAJMOTI STUDIO · JETPUR (EST. 1982)</text>
  </g>
</svg>