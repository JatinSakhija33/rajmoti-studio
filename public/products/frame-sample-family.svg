<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242B28"/><stop offset="50%" stop-color="#3A4843"/><stop offset="100%" stop-color="#181F1C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E2C17C"/>
      <stop offset="50%" stop-color="#FDF3CD"/>
      <stop offset="100%" stop-color="#B88A3B"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="1500" fill="url(#bg)"/>

  <!-- Atmosphere &amp; Studio Lighting -->
  <circle cx="600" cy="525" r="540" fill="#FFF8EE" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="1020" cy="225" r="360" fill="#FFE6B8" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Decorative Inner Border -->
  <rect x="36" y="36" width="1128" height="1428" rx="12" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
  <rect x="48" y="48" width="1104" height="1404" rx="8" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>

  <!-- Main Illustration / Graphic Elements -->
  
    <g filter="url(#shadow)" transform="translate(340, 350)">
      <!-- Family group silhouettes -->
      <circle cx="160" cy="210" r="42" fill="#F0E5D8"/>
      <circle cx="260" cy="190" r="45" fill="#F4EADB"/>
      <circle cx="360" cy="215" r="40" fill="#EADECF"/>
      <circle cx="260" cy="300" r="32" fill="#FBF5ED"/>
      <!-- Garments -->
      <path d="M 120 250 C 120 250, 160 240, 200 250 L 205 500 L 115 500 Z" fill="#50665B"/>
      <path d="M 210 235 C 210 235, 260 225, 310 235 L 315 500 L 205 500 Z" fill="#3D4E46"/>
      <path d="M 320 255 C 320 255, 360 245, 400 255 L 405 500 L 315 500 Z" fill="#6B7F74"/>
      <path d="M 225 330 C 225 330, 260 320, 295 330 L 295 500 L 225 500 Z" fill="#C59B5F"/>
    </g>
  

  <!-- Studio Typography &amp; Branding -->
  <g transform="translate(0, 1280)" text-anchor="middle">
    <text x="600" y="0" fill="#E2D9CC" font-family="'Montserrat', sans-serif" font-size="20" font-weight="600" letter-spacing="6" text-transform="uppercase">Generations of Togetherness</text>
    <text x="600" y="52" fill="#FFFFFF" font-family="'Playfair Display', serif" font-size="44" font-weight="bold">The Sakhija Family</text>
    <text x="600" y="95" fill="#E6DAC8" font-family="'Montserrat', sans-serif" font-size="22" letter-spacing="2" opacity="0.95">Cherished Moments at Home</text>
    <text x="600" y="145" fill="#C5B6A0" font-family="'Montserrat', sans-serif" font-size="16" letter-spacing="5">RAJMOTI STUDIO · JETPUR (EST. 1982)</text>
  </g>
</svg>