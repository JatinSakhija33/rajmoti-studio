<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B342B"/><stop offset="50%" stop-color="#544B3F"/><stop offset="100%" stop-color="#26211B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E2C17C"/>
      <stop offset="50%" stop-color="#FDF3CD"/>
      <stop offset="100%" stop-color="#B88A3B"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="1500" fill="url(#bg)"/>

  <!-- Atmosphere &amp; Studio Lighting -->
  <circle cx="600" cy="525" r="540" fill="#FFF8EE" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="1020" cy="225" r="360" fill="#FFE6B8" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Decorative Inner Border -->
  <rect x="36" y="36" width="1128" height="1428" rx="12" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>
  <rect x="48" y="48" width="1104" height="1404" rx="8" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.2"/>

  <!-- Main Illustration / Graphic Elements -->
  
    <g filter="url(#shadow)" transform="translate(360, 330)">
      <!-- Woven studio basket -->
      <ellipse cx="240" cy="380" rx="190" ry="85" fill="#8C6E4A"/>
      <ellipse cx="240" cy="365" rx="175" ry="70" fill="#FFF8EE"/>
      <!-- Baby sitting peacefully -->
      <circle cx="240" cy="230" r="58" fill="#FDF4EA"/>
      <path d="M 195 285 Q 240 270 285 285 L 295 400 L 185 400 Z" fill="#E8D5C4"/>
      <!-- Baby crown / floral wreath -->
      <circle cx="240" cy="225" r="64" fill="none" stroke="url(#gold)" stroke-width="5" stroke-dasharray="10 8"/>
    </g>
  

  <!-- Studio Typography &amp; Branding -->
  <g transform="translate(0, 1280)" text-anchor="middle">
    <text x="600" y="0" fill="#E2C17C" font-family="'Montserrat', sans-serif" font-size="20" font-weight="600" letter-spacing="6" text-transform="uppercase">First Year Milestone Portfolio</text>
    <text x="600" y="52" fill="#FFFFFF" font-family="'Playfair Display', serif" font-size="44" font-weight="bold">Baby Shivam</text>
    <text x="600" y="95" fill="#E6DAC8" font-family="'Montserrat', sans-serif" font-size="22" letter-spacing="2" opacity="0.95">6 Months Old · Little Explorer</text>
    <text x="600" y="145" fill="#C5B6A0" font-family="'Montserrat', sans-serif" font-size="16" letter-spacing="5">RAJMOTI STUDIO · JETPUR (EST. 1982)</text>
  </g>
</svg>