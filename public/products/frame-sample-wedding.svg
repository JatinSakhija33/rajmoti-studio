<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1F1A"/><stop offset="50%" stop-color="#4A2E24"/><stop offset="100%" stop-color="#1A120F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E2C17C"/>
      <stop offset="50%" stop-color="#FDF3CD"/>
      <stop offset="100%" stop-color="#B88A3B"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="1500" fill="url(#bg)"/>

  <!-- Atmosphere &amp; Studio Lighting -->
  <circle cx="600" cy="525" r="540" fill="#FFF8EE" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="1020" cy="225" r="360" fill="#FFE6B8" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Decorative Inner Border -->
  <rect x="36" y="36" width="1128" height="1428" rx="12" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>
  <rect x="48" y="48" width="1104" height="1404" rx="8" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.2"/>

  <!-- Main Illustration / Graphic Elements -->
  
    <g filter="url(#shadow)" transform="translate(350, 320)">
      <!-- Arch Gate Backdrop -->
      <path d="M 250 80 C 120 80, 50 180, 50 480 L 450 480 C 450 180, 380 80, 250 80 Z" fill="#42291E" opacity="0.7"/>
      <path d="M 250 100 C 135 100, 75 195, 75 480 L 425 480 C 425 195, 365 100, 250 100 Z" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
      <!-- Silhouettes of Couple in Royal Pose -->
      <circle cx="215" cy="220" r="45" fill="#F4E8D6"/>
      <circle cx="285" cy="235" r="40" fill="#EAD5BA"/>
      <!-- Groom Sherwani &amp; Turban -->
      <path d="M 180 260 Q 215 250 250 260 L 260 520 L 170 520 Z" fill="#8B2522"/>
      <polygon points="195,180 235,180 220,150 200,165" fill="#E2C17C"/>
      <!-- Bride Lehenga &amp; Dupatta -->
      <path d="M 250 270 Q 290 265 320 285 L 350 520 L 250 520 Z" fill="#991B1B"/>
      <path d="M 250 200 Q 320 220 340 380" stroke="url(#gold)" stroke-width="8" fill="none" opacity="0.8"/>
    </g>
  

  <!-- Studio Typography &amp; Branding -->
  <g transform="translate(0, 1280)" text-anchor="middle">
    <text x="600" y="0" fill="#E2C17C" font-family="'Montserrat', sans-serif" font-size="20" font-weight="600" letter-spacing="6" text-transform="uppercase">Royal Heritage Wedding Collection</text>
    <text x="600" y="52" fill="#FFFFFF" font-family="'Playfair Display', serif" font-size="44" font-weight="bold">Aarav &amp; Riya</text>
    <text x="600" y="95" fill="#E6DAC8" font-family="'Montserrat', sans-serif" font-size="22" letter-spacing="2" opacity="0.95">24 November 2026 · Rajkot</text>
    <text x="600" y="145" fill="#C5B6A0" font-family="'Montserrat', sans-serif" font-size="16" letter-spacing="5">RAJMOTI STUDIO · JETPUR (EST. 1982)</text>
  </g>
</svg>