<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B231D"/><stop offset="50%" stop-color="#44372E"/><stop offset="100%" stop-color="#1C1613"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E2C17C"/>
      <stop offset="50%" stop-color="#FDF3CD"/>
      <stop offset="100%" stop-color="#B88A3B"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="1500" fill="url(#bg)"/>

  <!-- Atmosphere & Studio Lighting -->
  <circle cx="600" cy="525" r="540" fill="#FFF8EE" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="1020" cy="225" r="360" fill="#FFE6B8" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Decorative Inner Border -->
  <rect x="36" y="36" width="1128" height="1428" rx="12" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>
  <rect x="48" y="48" width="1104" height="1404" rx="8" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.2"/>

  <!-- Main Illustration / Graphic Elements -->
  
      <g transform="translate(380, 340)">
        <rect x="0" y="0" width="440" height="480" rx="12" fill="#58483D" opacity="0.5"/>
        <rect x="12" y="12" width="416" height="456" rx="8" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
        <circle cx="220" cy="200" r="70" fill="#F4E8D6"/>
        <path d="M 140 270 C 140 270, 220 250, 300 270 L 310 460 L 130 460 Z" fill="#991B1B" opacity="0.9"/>
      </g>
    

  <!-- Studio Typography & Branding -->
  <g transform="translate(0, 1280)" text-anchor="middle">
    <text x="600" y="0" fill="#E2C17C" font-family="'Montserrat', sans-serif" font-size="20" font-weight="600" letter-spacing="6" text-transform="uppercase">Rajmoti Studio Portfolio</text>
    <text x="600" y="52" fill="#FFFFFF" font-family="'Playfair Display', serif" font-size="44" font-weight="bold">Heritage Family Portraits</text>
    <text x="600" y="95" fill="#E6DAC8" font-family="'Montserrat', sans-serif" font-size="22" letter-spacing="2" opacity="0.95">Generations Together in Jetpur</text>
    <text x="600" y="145" fill="#C5B6A0" font-family="'Montserrat', sans-serif" font-size="16" letter-spacing="5">RAJMOTI STUDIO · JETPUR (EST. 1982)</text>
  </g>
</svg>